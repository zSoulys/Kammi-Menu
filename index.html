<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kammi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="demo-mode">
    <div class="demo-toolbar">
        <strong>Kammi UI Demo</strong>
        <span class="demo-badge">Standalone · sem FiveM</span>
        <button type="button" id="demo-toggle-menu" class="demo-btn">Mostrar / Ocultar painel</button>
        <button type="button" id="demo-notify" class="demo-btn">Testar notificação</button>
    </div>
    <div id="demo-notif-root" class="demo-notif-root" aria-live="polite"></div>

    <div id="menu" class="menu-container">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo.png" alt="Kammi" class="brand-logo">
            </div>
            <nav class="sidebar-nav">
                <div class="nav-group-label">Jogador Local</div>
                <div class="nav-item active" data-category="jogador">
                    <span class="nav-icon">
                        <!-- Jogador: pessoa correndo (running figure, body leaning right) -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <!-- cabeça -->
                            <circle cx="14" cy="4.5" r="1.6"/>
                            <!-- torso inclinado -->
                            <path d="M13 6.5 L10.5 12"/>
                            <!-- braço esquerdo para trás -->
                            <path d="M11.5 8.5 L8.5 7"/>
                            <!-- braço direito para frente -->
                            <path d="M12 9 L15 10.5"/>
                            <!-- perna esquerda (passo para frente) -->
                            <path d="M10.5 12 L8 17 L10 18"/>
                            <!-- perna direita (para trás) -->
                            <path d="M10.5 12 L13 16 L16 15"/>
                        </svg>
                    </span>
                    <span class="nav-label">Jogador</span>
                </div>

                <div class="nav-item" data-category="visual">
                    <span class="nav-icon">
                        <!-- Visual: olho (ESP/visão) -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/>
                            <circle cx="12" cy="12" r="2.5"/>
                        </svg>
                    </span>
                    <span class="nav-label">Visual</span>
                </div>

                <div class="nav-item" data-category="aim">
                    <span class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"/>
                            <circle cx="12" cy="12" r="3"/>
                            <line x1="12" y1="2" x2="12" y2="6"/>
                            <line x1="12" y1="18" x2="12" y2="22"/>
                            <line x1="2" y1="12" x2="6" y2="12"/>
                            <line x1="18" y1="12" x2="22" y2="12"/>
                        </svg>
                    </span>
                    <span class="nav-label">Aim</span>
                </div>
                <div class="nav-item" data-category="armas">
                    <span class="nav-icon">
                        <!-- Armas: pistola vista lateral, cano para direita, empunhadura para baixo -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <!-- cano -->
                            <line x1="2" y1="10" x2="14" y2="10"/>
                            <!-- corpo superior da pistola -->
                            <path d="M14 8 L20 8 L20 12 L14 12 Z"/>
                            <!-- gatilho guard -->
                            <path d="M15 12 L14 15 L17 15 L17 12"/>
                            <!-- empunhadura inclinada -->
                            <path d="M14 12 L13 17 L16 17 L17 15"/>
                            <!-- martelo/slide detalhe -->
                            <line x1="19" y1="8" x2="19" y2="7"/>
                        </svg>
                    </span>
                    <span class="nav-label">Armas</span>
                </div>
                <div class="nav-group-label">Online</div>
                <div class="nav-item" data-category="veiculos">
                    <span class="nav-icon">
                        <!-- Veículos: carro visto de frente -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <!-- corpo do carro -->
                            <rect x="3" y="10" width="18" height="8" rx="2"/>
                            <!-- teto com parabrisa -->
                            <path d="M7 10 L8.5 5.5 Q12 4 15.5 5.5 L17 10"/>
                            <!-- janela parabrisa -->
                            <path d="M8.5 10 L9.5 6.5 Q12 5.5 14.5 6.5 L15.5 10"/>
                            <!-- roda esquerda -->
                            <circle cx="7" cy="18" r="2"/>
                            <!-- roda direita -->
                            <circle cx="17" cy="18" r="2"/>
                            <!-- farol esquerdo -->
                            <rect x="4" y="11.5" width="3" height="1.5" rx="0.5"/>
                            <!-- farol direito -->
                            <rect x="17" y="11.5" width="3" height="1.5" rx="0.5"/>
                        </svg>
                    </span>
                    <span class="nav-label">Veículos</span>
                </div>
                <div class="nav-item" data-category="players">
                    <span class="nav-icon">
                        <!-- Players: três pessoas lado a lado -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="6" r="2.5"/>
                            <path d="M8 21v-2a4 4 0 0 1 8 0v2"/>
                            <circle cx="4.5" cy="8" r="2"/>
                            <path d="M1 21v-1.5a3.5 3.5 0 0 1 5.5-2.9"/>
                            <circle cx="19.5" cy="8" r="2"/>
                            <path d="M23 21v-1.5a3.5 3.5 0 0 0-5.5-2.9"/>
                        </svg>
                    </span>
                    <span class="nav-label">Players</span>
                </div>
                <div class="nav-group-label">Outros</div>
                <div class="nav-item" data-category="cloud">
                    <span class="nav-icon">
                        <!-- Cloud: nuvem -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                        </svg>
                    </span>
                    <span class="nav-label">Cloud</span>
                </div>
                <div class="nav-item" data-category="tools">
                    <span class="nav-icon">
                        <!-- Tools: caixa de ferramentas -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="11" width="20" height="11" rx="1"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            <line x1="12" y1="15" x2="12" y2="17"/>
                        </svg>
                    </span>
                    <span class="nav-label">Tools</span>
                </div>
                <div class="nav-item" data-category="statebags">
                    <span class="nav-icon">
                        <!-- Statebags: código </> -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 18 22 12 16 6"/>
                            <polyline points="8 6 2 12 8 18"/>
                        </svg>
                    </span>
                    <span class="nav-label">Statebags</span>
                </div>
                <div class="nav-item" data-category="exploits">
                    <span class="nav-icon">
                        <!-- Exploits: bug/inseto -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 8V4"/>
                            <path d="M8.5 9.5L6 7"/>
                            <path d="M15.5 9.5L18 7"/>
                            <path d="M8 12H4"/>
                            <path d="M20 12h-4"/>
                            <path d="M8.5 14.5L6 17"/>
                            <path d="M15.5 14.5L18 17"/>
                        </svg>
                    </span>
                    <span class="nav-label">Exploits</span>
                </div>
                <div class="nav-item" data-category="configs">
                    <span class="nav-icon">
                        <!-- Configs: engrenagem -->
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                    </span>
                    <span class="nav-label">Configs</span>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <div class="content-header" id="title-bar">
                <span id="current-category" class="content-header-title is-hidden"></span>
                <div id="subnav" class="subnav is-hidden" role="tablist"></div>
            </div>
            <div class="content-body" id="content-body">
                <div class="empty-state">
                    <p>Nenhuma função nesta categoria ainda.</p>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
